services:
  db:
    image: postgres:17
    container_name: multi-tenant
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - multi_tenant_task_db_data:/var/lib/postgresql/data

volumes:
  multi_tenant_task_db_data:
